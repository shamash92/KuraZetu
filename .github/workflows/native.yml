name: iOS/Android tests

on:
  push:
    branches:
    - main
    paths:
    - 'NATIVE/**'
    - '.github/workflows/native.yml'
  pull_request:
    branches:
    - '*'
    paths:
    - 'NATIVE/**'
    - '.github/workflows/native.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: yarn
        cache-dependency-path: NATIVE/yarn.lock
    # Tests import packages such as Turf. Install scripts build native code,
    # which the tests do not need.
    - name: Install
      working-directory: "NATIVE"
      run: yarn install --frozen-lockfile --ignore-scripts --non-interactive
    - name: Test
      working-directory: "NATIVE"
      run: yarn test
