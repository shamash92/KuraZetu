{% load static %}
<header class="site-nav{% if sticky_nav %} site-nav--sticky{% endif %}">
  <div class="site-nav__inner">
    <a class="site-brand" href="/" aria-label="KuraZetu home">
      <span class="site-brand__name">KuraZetu<span aria-hidden="true">.</span></span>
      <span class="site-brand__tag">Powered by Kiongozi</span>
    </a>
    <button class="site-nav__toggle" type="button" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-navigation" hidden>
      <svg class="site-nav__menu-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16" /></svg>
      <svg class="site-nav__close-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m6 6 12 12M6 18 18 6" /></svg>
    </button>
    <div class="site-nav__menu" id="site-navigation">
      <nav class="site-nav__links" aria-label="Primary navigation">
        <a href="/ui/game/">pinVerify254</a>
        <a href="https://kurazetu.readthedocs.io/" target="_blank" rel="noreferrer">Docs</a>
        <a href="{% url 'blog:list' %}"{% if current_nav == "blog" %} class="is-current" aria-current="page"{% endif %}>Blog</a>
        <details class="site-nav__group">
          <summary{% if current_nav == "api" %} class="is-current"{% endif %}>Developers</summary>
          <div class="site-nav__sub">
            <a href="/ui/specs/">Specs</a>
            <a href="{% url 'rapidoc' %}"{% if current_nav == "api" %} class="is-current" aria-current="page"{% endif %}>API</a>
            <a href="https://github.com/shamash92/KuraZetu.git" target="_blank" rel="noreferrer">Contribute</a>
          </div>
        </details>
      </nav>
      <div class="site-nav__auth">
        {% if user.is_authenticated %}
          <a class="site-nav__logout" href="/accounts/logout/">Log out</a>
        {% else %}
          <a class="site-nav__login" href="/accounts/login/">Sign in</a>
          <a class="site-nav__register" href="/ui/signup/">Get started</a>
        {% endif %}
      </div>
    </div>
  </div>
</header>
<script src="{% static 'shared/site-nav.js' %}" defer></script>
