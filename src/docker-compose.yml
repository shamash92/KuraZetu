# Development only. This Compose application is not a production deployment.
x-web-image: &web-image
  build: .
  image: kurazetu-web:dev

services:
  webpack:
    image: kurazetu-webpack:dev
    build:
      context: .
      dockerfile: Dockerfile.webpack
    command: >-
      sh -ec "rm -f /app/static/ui/manifest.json;
      if ! sha256sum -c node_modules/.pnpm-dependencies.checksum; then
      pnpm install --frozen-lockfile;
      sha256sum package.json pnpm-lock.yaml
      > node_modules/.pnpm-dependencies.checksum;
      fi;
      exec pnpm run dev"
    volumes:
      - ./ui:/app
      - webpack_node_modules:/app/node_modules
      - pnpm_store:/app/.pnpm-store
      - react_static_volume:/app/static/ui
    working_dir: /app
    environment:
      NODE_ENV: development
      NODE_OPTIONS: --max-old-space-size=1536
    healthcheck:
      test: ["CMD", "test", "-f", "/app/static/ui/manifest.json"]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 10s
    restart: unless-stopped
    init: true
    tty: true
    cpus: 2.0
    mem_limit: 2g

  db:
    image: postgis/postgis:14-3.3
    environment:
      POSTGRES_DB: ${DATABASE_NAME}
      POSTGRES_USER: ${DATABASE_USER}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped
    cpus: 1.0
    mem_limit: 1g

  migrate:
    <<: *web-image
    command: python manage.py migrate --noinput
    volumes:
      - ./:/app
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    cpus: 1.0
    mem_limit: 1g

  web:
    <<: *web-image
    command: sh -c "python manage.py tailwind build && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./:/app
      - react_static_volume:/app/ui/static/ui
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      webpack:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10m
    restart: unless-stopped
    init: true
    cpus: 2.0
    mem_limit: 2g

  docs:
    profiles:
      - docs
    build:
      context: ../docs
    image: kurazetu-docs:dev
    volumes:
      - ../:/workspace:ro
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen("http://localhost:8000/", timeout=5)
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 1m
    init: true
    cpus: 1.0
    mem_limit: 1g

volumes:
  pnpm_store:
  postgres_data:
  react_static_volume:
  webpack_node_modules:
