# Tracked template for production log rotation.
#
# WatchedFileHandler (see CommunityTally/settings/base.py) never rotates
# itself — it only reopens a path when logrotate replaces the inode. A
# RotatingFileHandler inside Django was tried and rejected: each Gunicorn
# worker decides independently when to rotate, so workers race and lines
# are lost. Rotation has to stay a single external process acting on the
# shared file, which is what this config is for.
#
# Install on a server (see docs/how-to-guides/configure-log-rotation.md):
#   sudo cp src/.deploy/logrotate/kurazetu.conf /etc/logrotate.d/kurazetu
#   sudo logrotate -d /etc/logrotate.d/kurazetu   # dry run
#
# Adjust the paths below to match the server's actual LOG_FILE /
# AUTH_LOG_FILE values and the user/group Gunicorn runs as.

/var/log/kurazetu/app.log {
    size 10M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0664 kurazetu kurazetu
}

/var/log/kurazetu/auth_logs.log {
    size 10M
    rotate 8
    compress
    delaycompress
    missingok
    notifempty
    create 0600 kurazetu kurazetu
}
