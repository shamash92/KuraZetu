openapi: 3.0.3
info:
  title: Kura Zetu API - Kenyan Election Data & Results
  version: 1.0.0
  description: Comprehensive API for accessing Kenyan election data, including presidential,
    parliamentary, and local government results. Features real-time data, historical
    archives, and interactive documentation.
  contact:
    name: Kura Zetu Team
    url: https://kurazetu.com
  license:
    name: MIT License
    url: https://opensource.org/licenses/MIT
