components:
  schemas:
    CommunityNotesPollingCenter:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        code:
          type: string
          readOnly: true
        ward:
          type: string
          readOnly: true
        constituency:
          type: string
          readOnly: true
        county:
          type: string
          readOnly: true
      required:
      - code
      - constituency
      - county
      - id
      - name
      - ward
    Constituency:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureEnum'
        id:
          type: integer
          readOnly: true
        geometry:
          type: object
          properties:
            type:
              type: string
              enum:
              - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
                    format: float
                  example:
                  - 12.9721
                  - 77.5933
                  minItems: 2
                  maxItems: 3
                example:
                - - 22.4707
                  - 70.0577
                - - 12.9721
                  - 77.5933
                minItems: 4
              example:
              - - - 0.0
                  - 0.0
                - - 0.0
                  - 50.0
                - - 50.0
                  - 50.0
                - - 50.0
                  - 0.0
                - - 0.0
                  - 0.0
        properties:
          type: object
          properties:
            name:
              type: string
              maxLength: 255
            county:
              $ref: '#/components/schemas/County'
            number:
              type: integer
              readOnly: true
    ConstituencyList:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureCollectionEnum'
        features:
          type: array
          items:
            $ref: '#/components/schemas/Constituency'
    County:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureEnum'
        id:
          type: integer
          readOnly: true
        geometry:
          type: object
          properties:
            type:
              type: string
              enum:
              - Polygon
            coordinates:
              type: array
              items:
                type: array
                items:
                  type: array
                  items:
                    type: number
                    format: float
                  example:
                  - 12.9721
                  - 77.5933
                  minItems: 2
                  maxItems: 3
                example:
                - - 22.4707
                  - 70.0577
                - - 12.9721
                  - 77.5933
                minItems: 4
              example:
              - - - 0.0
                  - 0.0
                - - 0.0
                  - 50.0
                - - 50.0
                  - 50.0
                - - 50.0
                  - 0.0
                - - 0.0
                  - 0.0
        properties:
          type: object
          properties:
            number:
              type: integer
              readOnly: true
            name:
              type: string
              maxLength: 255
    CountyList:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/GisFeatureCollectionEnum'
        features:
          type: array
          items:
            $ref: '#/components/schemas/County'
    GisFeatureCollectionEnum:
      type: string
      enum:
      - FeatureCollection
    GisFeatureEnum:
      type: string
      enum:
      - Feature
    GovernorResults:
      type: object
      properties:
        county_number:
          type: integer
          readOnly: true
        aspirant:
          type: string
          readOnly: true
        running_mate:
          type: string
          readOnly: true
        aspirant_votes:
          type: integer
          maximum: 2147483647
          minimum: 0
        party_name:
          type: string
          readOnly: true
        party_short_name:
          type: string
          readOnly: true
      required:
      - aspirant
      - aspirant_votes
      - county_number
      - party_name
      - party_short_name
      - running_mate
    MCAResults:
      type: object
      properties:
        ward_number:
          type: integer
          readOnly: true
        aspirant:
          type: string
          readOnly: true
        aspirant_votes:
          type: integer
          maximum: 2147483647
          minimum: 0
        party_name:
          type: string
          readOnly: true
        party_short_name:
          type: string
          readOnly: true
      required:
      - aspirant
      - aspirant_votes
      - party_name
      - party_short_name
      - ward_number
    MPResults:
      type: object
      properties:
        constituency_number:
          type: integer
          readOnly: true
        aspirant:
          type: string
          readOnly: true
        aspirant_votes:
          type: integer
          maximum: 2147483647
          minimum: 0
        party_name:
          type: string
          readOnly: true
        party_short_name:
          type: string
          readOnly: true
      required:
      - aspirant
      - aspirant_votes
      - constituency_number
      - party_name
      - party_short_name
    PaginatedConstituencyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          $ref: '#/components/schemas/ConstituencyList'
    PaginatedCountyList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          $ref: '#/components/schemas/CountyList'
    PaginatedGovernorResultsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/GovernorResults'
    PaginatedMCAResultsList:
      type: object
      required:
      - count
      - results
      properties:
        count:
          type: integer
          example: 123
        next:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=4
        previous:
          type: string
          nullable: true
          format: uri
          example: http://api.example.org/accounts/?page=2
        results:
          type: array
          items:
            $ref: '#/components/schemas/MCAResults'
    PaginatedMPResultsList:
      type: object
